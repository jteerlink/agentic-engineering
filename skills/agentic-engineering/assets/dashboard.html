<!doctype html>
<!-- Read-only ticket dashboard for /run-tickets. Serve .scratch/ only:
     ln -sf ../docs/harness/dashboard.html .scratch/dashboard.html && python3 -m http.server 8765 --bind 127.0.0.1 -d .scratch -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket Board</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light;
    --bg: oklch(0.975 0.004 260);
    --surface: oklch(1 0 0);
    --lane: oklch(0.955 0.006 260);
    --line: oklch(0.885 0.009 260);
    --text: oklch(0.23 0.016 260);
    --muted: oklch(0.47 0.016 260);
    --blue: oklch(0.53 0.16 258);
    --green: oklch(0.52 0.13 142);
    --amber: oklch(0.55 0.13 62);
    --red: oklch(0.53 0.19 27);
    --ring: oklch(0.53 0.16 258 / 0.45);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: oklch(0.175 0.01 260);
      --surface: oklch(0.225 0.012 260);
      --lane: oklch(0.2 0.011 260);
      --line: oklch(0.31 0.014 260);
      --text: oklch(0.94 0.006 260);
      --muted: oklch(0.72 0.014 260);
      --blue: oklch(0.74 0.13 255);
      --green: oklch(0.82 0.15 132);
      --amber: oklch(0.8 0.13 75);
      --red: oklch(0.72 0.16 25);
      --ring: oklch(0.74 0.13 255 / 0.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: oklch(0.175 0.01 260);
    --surface: oklch(0.225 0.012 260);
    --lane: oklch(0.2 0.011 260);
    --line: oklch(0.31 0.014 260);
    --text: oklch(0.94 0.006 260);
    --muted: oklch(0.72 0.014 260);
    --blue: oklch(0.74 0.13 255);
    --green: oklch(0.82 0.15 132);
    --amber: oklch(0.8 0.13 75);
    --red: oklch(0.72 0.16 25);
    --ring: oklch(0.74 0.13 255 / 0.5);
  }

  * { box-sizing: border-box; }
  html { scrollbar-color: var(--line) transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-variant-numeric: tabular-nums;
    --gap: 28px;
    --cols: repeat(4, minmax(0, 1fr)) minmax(0, 1.15fr);
  }
  ::selection { background: color-mix(in oklab, var(--blue) 30%, transparent); }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 6px; }
  a { color: var(--blue); text-underline-offset: 3px; }
  svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

  /* Header */
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 20px 24px 12px; }
  h1 { font-size: 17px; font-weight: 650; letter-spacing: -0.01em; margin: 0; }
  #live { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }
  #live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); transition: background-color .2s; }
  body.stale #live .dot { background: var(--amber); }
  body.stale #live { color: var(--amber); }
  .theme { margin-left: auto; display: inline-flex; padding: 2px; gap: 2px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
  .theme button { font: inherit; font-size: 12px; color: var(--muted); background: none; border: 0; border-radius: 7px; padding: 4px 10px; cursor: pointer; transition: background-color .15s, color .15s; }
  .theme button:hover { color: var(--text); }
  .theme button[aria-pressed="true"] { background: var(--lane); color: var(--text); }
  #stale { display: none; margin: 0 24px 12px; padding: 10px 14px; border-radius: 10px; border: 1px solid color-mix(in oklab, var(--amber) 45%, transparent); background: color-mix(in oklab, var(--amber) 10%, var(--bg)); color: var(--text); }
  body.stale #stale { display: block; }

  main { padding: 4px 24px 32px; }

  /* Pipeline track */
  .track { display: grid; grid-template-columns: var(--cols); column-gap: var(--gap); margin-bottom: 16px; position: sticky; top: 0; z-index: 1; padding: 8px 0; background: var(--bg); }
  .node { position: relative; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); min-width: 0; transition: border-color .25s, background-color .25s; }
  .node .label { font-weight: 600; white-space: nowrap; }
  .node .hint { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .txt { min-width: 0; display: grid; }
  .node .count { margin-left: auto; font-weight: 650; font-size: 15px; }
  .node[data-stage="waiting"] svg.i { color: var(--muted); }
  .node[data-stage="ready"] svg.i { color: var(--text); }
  .node[data-stage="building"] svg.i { color: var(--blue); }
  .node[data-stage="done"] svg.i { color: var(--green); }
  .node[data-stage="attention"] svg.i { color: var(--amber); }
  .node.active { border-color: color-mix(in oklab, var(--blue) 55%, var(--line)); background: color-mix(in oklab, var(--blue) 8%, var(--surface)); }
  .node.alert { border-color: color-mix(in oklab, var(--amber) 55%, var(--line)); background: color-mix(in oklab, var(--amber) 8%, var(--surface)); }
  .node .spin-arc { opacity: 0; }
  .node.active .spin-arc { opacity: 1; transform-origin: 12px 12px; animation: spin 1.1s linear infinite; animation-delay: var(--phase-spin, 0ms); }
  .conn { position: absolute; top: 50%; right: calc(-1 * var(--gap)); width: var(--gap); height: 12px; translate: 0 -50%; color: var(--line); overflow: visible; }
  .conn path { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .conn .line { stroke-dasharray: 3 4; }
  .conn.flowing { color: var(--blue); }
  .conn.flowing .line { animation: flow .9s linear infinite; animation-delay: var(--phase-flow, 0ms); }
  .node[data-stage="attention"] { border-style: dashed; }

  /* Lanes: one per spec */
  .lane { margin-bottom: 20px; }
  .lane-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin: 0 2px 8px; }
  .lane-head h2 { font-size: 14px; font-weight: 650; margin: 0; }
  .lane-head .progress { color: var(--muted); }
  .lane-head a { display: inline-flex; align-items: center; gap: 6px; }
  .lane-grid { display: grid; grid-template-columns: var(--cols); column-gap: var(--gap); }
  .cell { background: var(--lane); border-radius: 14px; padding: 8px; min-height: 64px; display: grid; align-content: start; gap: 8px; }
  .cell[data-stage="attention"] { background: color-mix(in oklab, var(--amber) 6%, var(--lane)); }
  .cell-head { display: none; }
  .none { color: var(--muted); font-size: 12px; padding: 6px 4px; opacity: .7; }

  /* Cards */
  .card { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .card .top { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .card .num { font-weight: 650; color: var(--text); }
  .card .file { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .age { margin-left: auto; flex: none; }
  .card .title { font-weight: 600; overflow-wrap: anywhere; }
  .card .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .log { margin: 4px 0 0; font: 12px/1.45 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .card[data-tone="building"] { border-color: color-mix(in oklab, var(--blue) 50%, var(--line)); }
  .card[data-tone="building"] .meta { color: var(--blue); }
  .card[data-tone="done"] .meta { color: var(--green); }
  .card[data-tone="blocked"] { border-color: color-mix(in oklab, var(--amber) 55%, var(--line)); }
  .card[data-tone="blocked"] .meta { color: var(--amber); }
  .card[data-tone="unknown"] { border-color: color-mix(in oklab, var(--red) 55%, var(--line)); }
  .card[data-tone="unknown"] .meta { color: var(--red); }
  .card[data-tone="done"] .title { color: var(--muted); }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  /* Building: a light band sweeps the card's bottom edge */
  .scan { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: color-mix(in oklab, var(--blue) 18%, transparent); }
  .scan::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 35%; background: linear-gradient(90deg, transparent, var(--blue), transparent); animation: sweep 1.8s cubic-bezier(.45, 0, .55, 1) infinite; animation-delay: var(--phase-scan, 0ms); }
  .card[data-tone="building"] .pulse { animation: breathe 1.8s ease-in-out infinite; animation-delay: var(--phase-scan, 0ms); }

  /* A card that just changed stage */
  .card.arrived { animation: arrive .6s cubic-bezier(0.16, 1, 0.3, 1); }

  @keyframes spin { to { rotate: 360deg; } }
  @keyframes flow { to { stroke-dashoffset: -7; } }
  @keyframes sweep { from { translate: -100% 0; } to { translate: 290% 0; } }
  @keyframes breathe { 50% { opacity: .35; } }
  @keyframes arrive {
    from { translate: 0 -6px; box-shadow: 0 6px 18px -6px color-mix(in oklab, var(--blue) 45%, transparent); border-color: var(--blue); }
  }

  /* Stale: nothing is known to be moving, so nothing moves */
  body.stale *, body.stale *::after { animation-play-state: paused !important; }
  body.stale .conn.flowing { color: var(--line); }

  @media (prefers-reduced-motion: reduce) {
    .node.active .spin-arc, .conn.flowing .line, .scan::after, .card[data-tone="building"] .pulse { animation: none; }
    .scan { background: color-mix(in oklab, var(--blue) 70%, transparent); }
    .card.arrived { animation: arrive-still .6s ease-out; }
    @keyframes arrive-still { from { border-color: var(--blue); background: color-mix(in oklab, var(--blue) 12%, var(--surface)); } }
  }

  /* Narrow: the pipeline reads top to bottom */
  @media (max-width: 820px) {
    header, main { padding-left: 16px; padding-right: 16px; }
    #stale { margin: 0 16px 12px; }
    .track { display: none; }
    .lane-grid { grid-template-columns: 1fr; row-gap: 10px; }
    .cell-head { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--muted); padding: 2px 4px; }
    .cell.empty { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Ticket Board</h1>
  <span id="live" role="status"><span class="dot"></span><span id="live-text">Connecting…</span></span>
  <div class="theme" role="group" aria-label="Theme">
    <button type="button" data-theme="auto">Auto</button>
    <button type="button" data-theme="light">Light</button>
    <button type="button" data-theme="dark">Dark</button>
  </div>
</header>
<div id="stale" aria-live="polite"></div>
<main>
  <div class="track" id="track" aria-label="Pipeline"></div>
  <div id="lanes"></div>
</main>
<script>
// ponytail: reads http.server directory listings + ticket files; no index, no second source of truth.
const STAGES = [
  { key: "waiting", label: "Waiting", hint: "Blocked by a ticket", icon: "clock" },
  { key: "ready", label: "Ready", hint: "Next up", icon: "circle" },
  { key: "building", label: "Building", hint: "In /implement", icon: "spin" },
  { key: "done", label: "Done", hint: "Draft PR awaits review", icon: "check" },
  { key: "attention", label: "Needs attention", hint: "Blocked or unreadable", icon: "alert" },
];
const ICONS = {
  clock: [["circle", { cx: 12, cy: 12, r: 8.5 }], ["path", { d: "M12 7.5V12l3 2" }]],
  circle: [["circle", { cx: 12, cy: 12, r: 8.5 }], ["circle", { cx: 12, cy: 12, r: 2.5 }]],
  spin: [["circle", { cx: 12, cy: 12, r: 8.5, opacity: 0.3 }], ["path", { d: "M12 3.5a8.5 8.5 0 0 1 8.5 8.5", class: "spin-arc" }]],
  check: [["circle", { cx: 12, cy: 12, r: 8.5 }], ["path", { d: "m8.5 12.5 2.5 2.5 4.5-5" }]],
  alert: [["path", { d: "M10.3 4.6 3.2 17a2 2 0 0 0 1.7 3h14.2a2 2 0 0 0 1.7-3L13.7 4.6a2 2 0 0 0-3.4 0Z" }], ["path", { d: "M12 9.5v4" }], ["path", { d: "M12 16.8h.01" }]],
  pr: [["circle", { cx: 6, cy: 6, r: 2.25 }], ["circle", { cx: 6, cy: 18, r: 2.25 }], ["circle", { cx: 18, cy: 18, r: 2.25 }], ["path", { d: "M6 8.25v7.5" }], ["path", { d: "M18 15.75V10a3 3 0 0 0-3-3h-4" }], ["path", { d: "m13 5-2 2 2 2" }]],
};
const POLL_MS = 3000;
const PERIODS = { spin: 1100, flow: 900, scan: 1800 };
const NS = "http://www.w3.org/2000/svg";
let inFlight = false, lastOk = null, lastSig = "", prevStage = new Map();

// ---------- data ----------
async function get(path) {
  const r = await fetch(path, { cache: "no-store", signal: AbortSignal.timeout(5000) });
  if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`);
  return r;
}

async function links(dir, suffix) {
  const r = await fetch(dir, { cache: "no-store", signal: AbortSignal.timeout(5000) });
  if (r.status === 404) return [];
  if (!r.ok) throw new Error(`${dir}: HTTP ${r.status}`);
  const doc = new DOMParser().parseFromString(await r.text(), "text/html");
  return [...doc.querySelectorAll("a")].map(a => a.getAttribute("href"))
    .filter(h => h && h.endsWith(suffix) && !h.startsWith("/") && !h.startsWith(".") && !h.includes(":"));
}

function field(text, name) {
  const m = text.match(new RegExp(`^${name}:\\s*(.*)$`, "mi"));
  return m ? m[1].trim() : "";
}

function parse(slug, file, text, modified) {
  const h1 = (text.match(/^#\s+(.+)$/m) || [, file])[1];
  const log = text.split(/^##\s+Log\s*$/m)[1];
  const blockers = field(text, "Blocked by").split(/[,\s]+/).filter(b => /^\d+$/.test(b));
  const num = (file.match(/^(\d+)/) || [, ""])[1];
  return {
    id: `${slug}/${file}`, slug, file, num, modified,
    title: h1.replace(new RegExp(`^${num}\\s*:\\s*`), ""),
    status: field(text, "Status").toLowerCase(), pr: field(text, "PR"), blockers,
    log: log ? log.trim().split(/\n\s*\n/).pop().slice(-400) : "",
  };
}

function classify(t, all) {
  t.waitingOn = [];
  if (t.status === "ready") {
    t.waitingOn = t.blockers.filter(b => {
      const dep = all.find(o => o.slug === t.slug && Number(o.num) === Number(b));
      return !dep || dep.status !== "done";
    });
    t.stage = t.waitingOn.length ? "waiting" : "ready";
  } else if (t.status === "building" || t.status === "done") {
    t.stage = t.status;
  } else {
    t.stage = "attention";
  }
  t.tone = t.stage === "attention" ? (t.status === "blocked" ? "blocked" : "unknown") : t.stage;
}

// ---------- view helpers (textContent only: ticket text is untrusted) ----------
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function icon(name, cls = "i") {
  const s = document.createElementNS(NS, "svg");
  s.setAttribute("viewBox", "0 0 24 24");
  s.setAttribute("class", cls);
  s.setAttribute("aria-hidden", "true");
  for (const [tag, attrs] of ICONS[name]) {
    const c = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) c.setAttribute(k, v);
    s.append(c);
  }
  return s;
}

function connector(flowing) {
  const s = document.createElementNS(NS, "svg");
  s.setAttribute("viewBox", "0 0 28 12");
  s.setAttribute("class", flowing ? "conn flowing" : "conn");
  s.setAttribute("aria-hidden", "true");
  for (const [d, cls] of [["M4 6H22", "line"], ["m19 2.5 3.5 3.5L19 9.5", ""]]) {
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", d);
    if (cls) p.setAttribute("class", cls);
    s.append(p);
  }
  return s;
}

function ago(ms) {
  if (!ms || isNaN(ms)) return "";
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 60) return `${s}s`;
  if (s < 3600) return `${Math.round(s / 60)}m`;
  if (s < 86400) return `${Math.round(s / 3600)}h`;
  return `${Math.round(s / 86400)}d`;
}

function updateAges() {
  for (const a of document.querySelectorAll("[data-mod]")) a.textContent = ago(Number(a.dataset.mod));
}

// Keep looping animations on one shared clock, so a re-render never makes them jump.
function syncPhases() {
  const now = performance.now();
  for (const [k, p] of Object.entries(PERIODS)) document.body.style.setProperty(`--phase-${k}`, `${-(now % p)}ms`);
}

// ---------- render ----------
function card(t) {
  const c = el("article", "card");
  c.dataset.tone = t.tone;
  const top = el("div", "top");
  top.title = t.file;
  top.append(el("span", "num", t.num || "—"), el("span", "file", t.file));
  const age = el("span", "age");
  age.dataset.mod = String(t.modified);
  age.title = "Time since the ticket file last changed";
  top.append(age);
  c.append(top, el("div", "title", t.title));

  const meta = el("div", "meta");
  if (t.stage === "waiting") {
    meta.append(el("span", null, "After"));
    for (const b of t.waitingOn) meta.append(el("span", "chip", b));
  } else if (t.stage === "ready") {
    meta.append(el("span", null, "Blockers done"));
  } else if (t.stage === "building") {
    meta.append(el("span", "pulse"), el("span", null, "Being worked on"));
  } else if (t.stage === "done") {
    meta.append(icon("check"), el("span", null, "Verified"));
  } else if (t.tone === "blocked") {
    meta.append(icon("alert"), el("span", null, "Blocked · needs a human"));
  } else {
    meta.append(icon("alert"), el("span", null, t.status ? `Unrecognised status “${t.status}”` : "No Status: line"));
  }
  c.append(meta);
  if (t.log && (t.stage === "attention" || t.stage === "done")) {
    c.append(el("pre", "log", t.stage === "done" ? t.log.split("\n")[0] : t.log));
  }
  if (t.stage === "building") c.append(el("div", "scan"));
  const before = prevStage.get(t.id);
  if (before && before !== t.stage) c.classList.add("arrived");
  return c;
}

function renderTrack(tickets) {
  const track = document.getElementById("track");
  const building = tickets.some(t => t.stage === "building");
  const nodes = STAGES.map((s, i) => {
    const n = el("div", "node");
    n.dataset.stage = s.key;
    const count = tickets.filter(t => t.stage === s.key).length;
    if (s.key === "building" && count) n.classList.add("active");
    if (s.key === "attention" && count) n.classList.add("alert");
    const txt = el("div", "txt");
    txt.append(el("span", "label", s.label), el("span", "hint", s.hint));
    n.append(icon(s.icon), txt, el("span", "count", String(count)));
    n.setAttribute("aria-label", `${s.label}: ${count}`);
    // Arrows join the main flow; "Needs attention" is a side exit, so no arrow into it.
    if (i < 3) n.append(connector(building && (s.key === "ready" || s.key === "building")));
    return n;
  });
  track.replaceChildren(...nodes);
}

function renderLanes(tickets) {
  const lanes = document.getElementById("lanes");
  const slugs = [...new Set(tickets.map(t => t.slug))];
  if (!slugs.length) {
    const empty = el("p", "none", "No tickets yet. Run /to-tickets on an approved spec; its tickets appear here as they are written.");
    lanes.replaceChildren(empty);
    return;
  }
  lanes.replaceChildren(...slugs.map(slug => {
    const mine = tickets.filter(t => t.slug === slug);
    const lane = el("section", "lane");
    lane.setAttribute("aria-label", `Spec ${slug}`);
    const head = el("div", "lane-head");
    head.append(el("h2", null, slug), el("span", "progress", `${mine.filter(t => t.status === "done").length} of ${mine.length} done`));
    const pr = mine.map(t => t.pr).find(u => /^https:\/\/\S+$/.test(u));  // untrusted: plain https links only
    if (pr) {
      const a = el("a");
      a.href = pr; a.target = "_blank"; a.rel = "noopener noreferrer";
      const n = (pr.match(/\/pull\/(\d+)/) || [])[1];
      a.append(icon("pr"), el("span", null, n ? `Draft PR #${n}` : "Draft PR"));
      head.append(a);
    }
    const grid = el("div", "lane-grid");
    for (const s of STAGES) {
      const items = mine.filter(t => t.stage === s.key);
      const cell = el("div", items.length ? "cell" : "cell empty");
      cell.dataset.stage = s.key;
      const ch = el("div", "cell-head");
      ch.append(icon(s.icon), el("span", null, `${s.label} · ${items.length}`));
      cell.append(ch);
      if (!items.length) cell.append(el("div", "none", "—"));
      for (const t of items) cell.append(card(t));
      grid.append(cell);
    }
    lane.append(head, grid);
    return lane;
  }));
}

function render(tickets) {
  syncPhases();
  renderTrack(tickets);
  renderLanes(tickets);
  prevStage = new Map(tickets.map(t => [t.id, t.stage]));
  updateAges();
}

async function refresh() {
  if (inFlight) return;  // never overlap polls
  inFlight = true;
  try {
    const tickets = [];
    for (const slugDir of await links("./", "/")) {
      const slug = decodeURIComponent(slugDir.slice(0, -1));
      for (const f of await links(`${slugDir}issues/`, ".md")) {
        const r = await get(`${slugDir}issues/${f}`);
        tickets.push(parse(slug, decodeURIComponent(f), await r.text(), Date.parse(r.headers.get("Last-Modified"))));
      }
    }
    for (const t of tickets) classify(t, tickets);
    tickets.sort((a, b) => a.slug.localeCompare(b.slug) || a.file.localeCompare(b.file));
    // Re-render only on a real change, so running animations aren't restarted every poll.
    const sig = JSON.stringify(tickets.map(({ modified, ...rest }) => rest));
    if (sig !== lastSig) { render(tickets); lastSig = sig; }
    lastOk = new Date();
    document.body.classList.remove("stale");
    document.getElementById("live-text").textContent = `Live · updated ${lastOk.toLocaleTimeString()}`;
  } catch (e) {
    document.body.classList.add("stale");
    const since = lastOk ? lastOk.toLocaleTimeString() : "never";
    document.getElementById("live-text").textContent = `Stale · last update ${since}`;
    document.getElementById("stale").textContent = `Stale: can't reach the server (${e.message}). Showing the last good view from ${since}; nothing here is known to be moving.`;
  } finally {
    inFlight = false;
  }
}

// ---------- theme ----------
function setTheme(v) {
  if (v === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = v;
  for (const b of document.querySelectorAll(".theme button")) b.setAttribute("aria-pressed", String(b.dataset.theme === v));
  try { localStorage.setItem("ticket-board-theme", v); } catch {}
}
let saved = "auto";
try { saved = localStorage.getItem("ticket-board-theme") || "auto"; } catch {}
setTheme(saved);
for (const b of document.querySelectorAll(".theme button")) b.addEventListener("click", () => setTheme(b.dataset.theme));

// The board reads the folder it is served from, so anywhere but the root of a served .scratch/
// (file://, docs/harness/) it would show a false "No tickets yet". Say how to open it instead.
const dir = location.pathname.replace(/[^/]*$/, "");
if (location.protocol === "file:" || !(dir === "/" || dir.endsWith("/.scratch/"))) {
  document.body.classList.add("stale");
  document.getElementById("live-text").textContent = "Not connected";
  document.getElementById("stale").textContent = "This page reads tickets from the folder it is served from, so open it from .scratch/. From the repo root run: ln -sf ../docs/harness/dashboard.html .scratch/dashboard.html && python3 -m http.server 8765 --bind 127.0.0.1 -d .scratch, then open http://127.0.0.1:8765/dashboard.html";
} else {
  refresh();
  setInterval(refresh, POLL_MS);
}
setInterval(updateAges, 1000);
</script>
