[project]
name = "jev-router"
version = "0.1.0"
description = "Claude Code PreToolUse hook: Jev picks the model a subagent runs on"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jev-router = "jev_router:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["jev_router"]
